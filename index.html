<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JeffTheHouse — Choose Wisely</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600;700&family=UnifrakturMaguntia&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <style>
    .hero-center {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.25rem;
    }

    .hero-box {
      max-width: 620px;
      width: 100%;
      background: rgba(5, 8, 7, 0.78);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.75rem 2rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 40px rgba(0, 255, 65, 0.12);
    }

    .hero-title {
      font-size: clamp(2.8rem, 7vw, 4.25rem);
      color: var(--matrix-green);
      text-shadow: 0 0 18px rgba(0, 255, 65, 0.4);
      margin-bottom: 0.75rem;
    }

    .hero-subtitle {
      font-family: var(--font-mono);
      color: var(--text);
      font-size: 1.05rem;
      margin: 0 0 2rem;
    }

    .pill-choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .pill-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    .pill-caption {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .pill-option .btn {
      width: 100%;
    }
  </style>
</head>
<body>
  <canvas id="Matrix" aria-hidden="true"></canvas>

  <main class="page-shell hero-center">
    <section class="hero-box">
      <h1 class="display-title hero-title">Welcome</h1>
      <p class="hero-subtitle">Choose wisely, there is no turning back.</p>

      <div class="pill-choices">
        <div class="pill-option">
          <a href="blue.html" class="btn btn-blue">Blue Pill</a>
          <span class="pill-caption">Portfolio, research &amp; repositories</span>
        </div>
        <div class="pill-option">
          <a href="red.html" class="btn btn-red">Red Pill</a>
          <span class="pill-caption">Interactive lab &amp; project frontends</span>
        </div>
      </div>

      <p class="mono muted" style="font-size: 0.8rem; margin: 0;">
        <a
          href="https://github.com/JeffTheHouse"
          target="_blank"
          rel="noopener noreferrer"
          class="card-link"
        >
          github.com/JeffTheHouse
        </a>
      </p>
    </section>
  </main>

  <script type="module">
    import { initMatrixRain } from './assets/js/matrix.js';
    initMatrixRain('Matrix', { color: '#00ff41', fontSize: 13, intervalMs: 32, opacity: 0.65 });
  </script>
</body>
</html>
